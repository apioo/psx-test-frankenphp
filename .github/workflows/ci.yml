name: CI
on:
  - pull_request
  - push
jobs:
  phpunit:
    name: "PHPUnit (PHP: ${{ matrix.php-versions }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions:
          - 8.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Setup MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE psx;" -uroot -proot
          mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'test1234';" -uroot -proot
      - name: Setup FrankenPHP
        run: curl https://frankenphp.dev/install.sh | sh
      - name: Composer install
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Run
        run: CADDY_GLOBAL_OPTIONS="auto_https off" frankenphp php-server --worker public/index.php --listen :8080 -v > frankenphp.log 2>&1 &
      - name: Wait
        run: sleep 4
      - name: Run PHPUnit
        run: SEND=external vendor/bin/phpunit
      - name: Print Server Logs on Failure
        if: failure()
        run: cat frankenphp.log
