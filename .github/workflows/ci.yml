name: CI
on:
  - pull_request
  - push
jobs:
  phpunit:
    name: "PHPUnit (PHP: ${{ matrix.php-versions }})"
    runs-on: ubuntu-latest
    env:
      APP_CONNECTION: "pdo-sqlite:////${{ github.workspace }}/cache/app.db"
    strategy:
      matrix:
        php-versions:
          - 8.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Setup MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE psx;" -uroot -proot
          mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'test1234';" -uroot -proot
      - name: Install FrankenPHP Binary with Extensions
        run: |
          curl -sSF "https://frankenphp.dev/install.sh" | FRANKENPHP_CONFIG="--with-pdo --with-pdo-sqlite" sh
          sudo mv frankenphp /usr/local/bin/
      - name: Composer install
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Start FrankenPHP
        run: frankenphp run --config Caddyfile > frankenphp.log 2>&1 &
      - name: Wait for FrankenPHP
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "FrankenPHP is up!"
              exit 0
            fi
            echo "Waiting for port 8080... ($i/10)"
            sleep 1
          done
          
          echo "FrankenPHP failed to start! Dumping log:"
          cat frankenphp.log
          exit 1
      - name: Run PHPUnit
        run: SEND=external vendor/bin/phpunit
      - name: Print Logs on Failure
        if: failure()
        run: cat frankenphp.log
